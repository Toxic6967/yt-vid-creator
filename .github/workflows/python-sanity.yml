name: Python sanity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q shorts_studio scripts/blender run.py
      - name: Install smoke-test dependencies
        run: python -m pip install -q "httpx>=0.28,<1" "beautifulsoup4>=4.13,<5" "ddgs>=9.16,<10"
      - name: Smoke test real-game schema and animation timeline
        env:
          SHORTS_STUDIO_DATA: ${{ runner.temp }}/shorts-data
        run: |
          python - <<'PY'
          from shorts_studio.db import init_db, create_job, get_job
          from shorts_studio.services.animation_timeline import normalise_animation_plan
          from shorts_studio.services.story_engine import (
              _fallback_scene_scaffold,
              _normalise_story,
              _required_scene_count,
          )

          init_db()
          create_job({
              'id': 'ci-v3',
              'channel_name': 'CI',
              'niche': 'Roblox stories',
              'requested_topic': 'test',
              'content_type': 'story',
              'story_genre': 'action',
              'visual_mode': 'animated',
              'voice': 'auto-youthful-male',
              'target_seconds': 65,
          })
          job = get_job('ci-v3')
          assert job and job['visual_mode'] == 'animated'

          scenes = []
          audio = []
          plates = {}
          cameras = ['wide','medium','close-up','follow','low-angle','high-angle']
          actions = ['run forward','jump obstacle','raise shield','energy blast','point at exit','celebrate win']
          for i in range(6):
              key = f'area {i}'
              scenes.append({
                  'role': 'hook' if i == 0 else ('payoff' if i == 5 else 'build'),
                  'characters': ['player'],
                  'environment_key': key,
                  'environment': key,
                  'action': actions[i],
                  'camera': cameras[i],
              })
              audio.append({'duration': 3.0})
              plates[key] = f'/tmp/{i}.png'
          plan = normalise_animation_plan(
              {'shots': []},
              script={
                  'game_name': 'Test Game',
                  'genre': 'action',
                  'characters': [{'id':'player','name':'Player','visual_identity':'R15'}],
                  'scenes': scenes,
              },
              scene_audio=audio,
              environment_plates=plates,
              allow_powers=False,
          )
          assert len(plan['shots']) == 6
          assert plan['shots'][0]['actors'][0]['clip'] == 'run'
          assert plan['shots'][1]['actors'][0]['clip'] == 'jump'
          assert all(a['power_effect'] == 'none' for s in plan['shots'] for a in s['actors'])

          # Regression guard for the old "0 usable scenes / needs 14" failure.
          minimum, desired = _required_scene_count(65)
          context = {
              'game_name': 'DOORS',
              'visual_setpieces': [
                  {'name': 'Hotel Hallway'},
                  {'name': 'Library'},
                  {'name': 'Greenhouse'},
                  {'name': 'Electrical Room'},
              ],
              'locations': [],
              'mechanics': [],
              'player_situations': [],
          }
          arc = {
              'central_goal': 'The player has to reach the next safe room before the threat catches up.',
              'stakes': 'A failed route ends the run.',
              'hook_event': 'The player opens a dangerous room with no safe hiding spot nearby.',
              'setup': 'The player checks the hallway and picks a route toward the next room.',
              'first_obstacle': 'The expected safe path is blocked by the room layout.',
              'failed_attempt': 'The player commits to the wrong side and loses time.',
              'escalation': 'The threat closes the distance as the player crosses the next area.',
              'turning_point': 'The player notices a safer route using a verified room mechanic.',
              'climax': 'The player uses the mechanic correctly and reaches the safe room.',
              'payoff': 'The door shuts behind the player just before the threat arrives.',
          }
          scaffold = _fallback_scene_scaffold(
              desired=desired,
              game_context=context,
              arc_plan=arc,
          )
          assert len(scaffold) >= minimum
          normalized = _normalise_story(
              {
                  'title': 'CI Story',
                  'game_name': context['game_name'],
                  'genre': 'action',
                  'characters': [
                      {'id':'player','name':'Player','gender':'male'},
                      {'id':'friend','name':'Friend','gender':'female'},
                  ],
                  'story_goal': arc['central_goal'],
                  'stakes': arc['stakes'],
                  'turning_point': arc['turning_point'],
                  'payoff': arc['payoff'],
                  'scenes': scaffold,
              },
              65,
              context,
          )
          assert len(normalized['scenes']) >= minimum
          assert normalized['scenes'][0]['role'] == 'hook'
          assert normalized['scenes'][-1]['role'] == 'payoff'
          print('Real-game smoke test OK')
          PY
